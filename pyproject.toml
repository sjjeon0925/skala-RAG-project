[project]
name = "kv-cache-capstone"
version = "0.1.0"
description = "ITME와 CXL-PIM 데이터센터 적용성 근거 기반 비교 평가"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
rag = [
    "langchain-community",
    "langchain-huggingface",
    "sentence-transformers",
    "transformers",
    "numpy",
    "faiss-cpu",
    "rank-bm25",
    "pymupdf>=1.23",
]

# OpenAI Responses / Tavily는 표준 라이브러리 HTTP 클라이언트를 사용한다.
