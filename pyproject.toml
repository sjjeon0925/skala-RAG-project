[project]
name = "kv-cache-capstone"
version = "0.2.0"
description = "근거 검증과 다관점 평가 기반 ITME/CXL-PIM Agentic RAG 보고서"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.10,<3",
    "openai>=1.68,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.4,<6",
    "rank-bm25>=0.2.2,<1",
    "pymupdf>=1.25,<2",
    "numpy>=1.26,<3",
]
dev = ["ruff>=0.11"]

[tool.ruff]
line-length = 110
target-version = "py311"
